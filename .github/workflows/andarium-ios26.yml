           expect_cmake_diagnostic "lib/libintl.a" verify "$CASE" ios
          diff --git a/tests/tooling/dependencies/test_verify_ios_static_xcframework.sh b/tests/tooling/dependencies/test_verify_ios_static_xcframework.sh
          index ea813f9b8..70c018268 100755
          --- a/tests/tooling/dependencies/test_verify_ios_static_xcframework.sh
          +++ b/tests/tooling/dependencies/test_verify_ios_static_xcframework.sh
          @@ -27,9 +27,9 @@ verify_zstd()
