      - name: Check toolchain and prepare build tools
        id: toolchain
        run: |
          test "$(uname -m)" = arm64
          git config --global user.name "$(git log -1 --format=%an)"
          git config --global user.email "$(git log -1 --format=%ae)"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          brew install cmake ninja autoconf automake libtool gettext gperf groff pkgconf make rsync
          python3 -m venv .build/gpu-tools-venv
          .build/gpu-tools-venv/bin/pip install meson mako pyyaml packaging
          echo "$PWD/.build/gpu-tools-venv/bin" >> "$GITHUB_PATH"
          xcodebuild -downloadComponent MetalToolchain
          echo "fingerprint=$({ xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version; xcrun clang --version; } | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Check video API availability before building dependencies
        run: |
          for source in darwin/platform/apple/video_decoder.mm darwin/platform/apple/video_encoder.mm darwin/platform/apple/video_encoder_discovery.mm; do
            xcrun --sdk iphoneos clang++ -target arm64-apple-ios26.0 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -std=c++20 -fobjc-arc -Wall -Wextra -Werror -I darwin/platform -fsyntax-only "$source"
          done
      - name: Test the Swift models
        run: |
          swift test --package-path GuestHost/Core
          swift test --package-path Andarium/AndariumCore
      - name: Download and verify accepted kernel and Android image
        run: |
          mkdir -p "$RUNNER_TEMP/andarium-assets" .build/kernel/artifacts
          curl -fL --retry 3 --max-time 900 'https://github.com/imxieyi/Kernarium/releases/download/1.0b9-beta/android-6.18-arm64-4k-20261111-6.18.60-mc2.tar.gz' -o "$RUNNER_TEMP/andarium-assets/kernel.tar.gz"
          curl -fL --retry 3 --max-time 1800 'https://github.com/imxieyi/Kernarium/releases/download/1.0b9-beta/lineage24-mainline6.18-4k-20261110-los24-r22.tar.gz' -o "$RUNNER_TEMP/andarium-assets/system.tar.gz"
          (cd "$RUNNER_TEMP/andarium-assets" && printf '%s\n' '79fc3acb85a347736fb27192c3a1c26ccfc21ba8ffbcc1a256f53b274b79856b  kernel.tar.gz' '0ba8a67798d79260221349cb9b749dd1bdfc1b679a55428fa1f6d12cd54c3aa2  system.tar.gz' | shasum -a 256 -c -)
          tar -xzf "$RUNNER_TEMP/andarium-assets/kernel.tar.gz" -C .build/kernel/artifacts
          tar -xzf "$RUNNER_TEMP/andarium-assets/system.tar.gz" -C "$RUNNER_TEMP/andarium-assets"
          python3 android/lineage-24/tools/install-release.py --source "$RUNNER_TEMP/andarium-assets/lineage24-mainline6.18-4k-20261110-los24-r22"
          python3 Andarium/scripts/stage-system-image.py
      - name: Restore verified native dependency cache
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .build/dependencies
            .build/dependency-cache
            external/sources
          key: ios26-native-v1-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('dependencies/**', 'tools/rootfs/vulkan/metadata/**', 'cmake/toolchains/Apple.cmake', 'scripts/patch_series.py') }}
      - name: Prepare verified native dependency sources
        run: |
          for product in ios-compression ios-storage ios-network apple-gpu-vulkan-experiment; do
            dependencies/prepare.sh --product "$product"
          done
      - name: Build libraries with an iOS 26 deployment target
        run: |
          dependencies/build-ios-zstd.sh
          dependencies/build-ios-storage.sh
          dependencies/build-ios-network.sh --platform ios
          dependencies/build-apple-gpu.sh --platform ios --jobs 3
      - name: Save verified native dependencies before compiling the runtime
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .build/dependencies
            .build/dependency-cache
            external/sources
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Build and package the Android runtime
        run: |
          cmake --preset kernarium-ios-device-android
          cmake --build --preset kernarium-ios-device-android
          Kernarium/scripts/package-ios-frameworks.sh --sdk device --runtimes android
      - name: Check audio interruption and microphone recovery
        run: |
          python3 tests/integration/audio/run_ios_interruption.py --sink-directory "$PWD/darwin/device/audio" --include-directory "$PWD/darwin" --deployment-target 27.0
      - name: Build unsigned release for sideloading
        run: |
          xcodebuild -project Andarium/Andarium.xcodeproj -scheme Andarium -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/Andarium-build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CURRENT_PROJECT_VERSION="$((${GITHUB_RUN_NUMBER} + 1000))" build
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$RUNNER_TEMP/Andarium-build/Build/Products/Release-iphoneos/Andarium.app" "$RUNNER_TEMP/ipa/Payload/Andarium.app"
          python3 - "$RUNNER_TEMP/ipa/Payload/Andarium.app" <<'PY'
          import pathlib, plistlib, subprocess, sys
          app = pathlib.Path(sys.argv[1])
          for path in app.rglob('Info.plist'):
              info = plistlib.loads(path.read_bytes())
              floor = info.get('MinimumOSVersion')
              if floor and tuple(map(int, floor.split('.'))) > (26, 7):
                  raise SystemExit(f'{path}: minimum OS is {floor}')
          checked = 0
          for path in app.rglob('*'):
              if not path.is_file():
                  continue
              with path.open('rb') as handle:
                  magic = handle.read(4)
              if magic not in (b'\xcf\xfa\xed\xfe', b'\xfe\xed\xfa\xcf'):
                  continue
              output = subprocess.check_output(['xcrun', 'vtool', '-show-build', str(path)], text=True)
              for line in output.splitlines():
                  words = line.split()
                  if words and words[0] == 'minos' and tuple(map(int, words[1].split('.'))) > (26, 7):
                      raise SystemExit(f'{path}: binary minimum OS exceeds 26.7')
              checked += 1
          if checked == 0:
              raise SystemExit('No arm64 binaries were verified')
          print(f'Verified {checked} arm64 binaries for iOS 26.7 or earlier')
          PY
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/deliverables/Andarium-ios26-unsigned.ipa" Payload)
          shasum -a 256 deliverables/Andarium-ios26-unsigned.ipa > deliverables/SHA256SUMS.txt
          cp Andarium/Config/Andarium.entitlements deliverables/Required-entitlements.plist
      - name: Upload IPA and corresponding source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Andarium-iOS26-build-${{ github.run_number }}
          path: deliverables/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
