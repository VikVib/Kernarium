name: Build Andarium for iOS 26
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: andarium-ios26
  cancel-in-progress: false
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: 1
      CMAKE_BUILD_PARALLEL_LEVEL: 3
      UML_APPLE_GPU_DEPENDENCY_JOBS: 3
      UML_IOS_NETWORK_DEPENDENCY_JOBS: 3
      UML_IOS_STORAGE_DEPENDENCY_JOBS: 3
      UML_IOS_ZSTD_DEPENDENCY_JOBS: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply the reviewed iOS 26 source backport
        run: |
          cat > "$RUNNER_TEMP/ios26.patch" <<'BACKPORT'
